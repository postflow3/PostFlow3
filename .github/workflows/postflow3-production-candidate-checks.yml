name: PostFlow3 Production Candidate Checks

on:
  push:
    branches:
      - postflow-v2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-storage-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find functions workers -type f -name '*.js' -print0)
      - name: Validate D1 migrations and scheduler lock
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("migrations").glob("*.sql")):
              print("Applying", migration)
              db.executescript(migration.read_text(encoding="utf-8"))

          now = 1_000_000
          lock_sql = """
          INSERT INTO kv_store (key, value, expires_at, updated_at) VALUES (?, ?, ?, ?)
          ON CONFLICT(key) DO UPDATE SET value = excluded.value,
            expires_at = excluded.expires_at, updated_at = excluded.updated_at
          WHERE CASE WHEN json_valid(kv_store.value)
            THEN CAST(json_extract(kv_store.value, '$.until') AS INTEGER)
            ELSE 0 END <= ?
          """
          first = db.execute(lock_sql, (
              "system:scheduler-lock", json.dumps({"runId": "first", "until": now + 240_000}),
              now + 300_000, now, now
          ))
          assert first.rowcount == 1, "first scheduler lock should be acquired"
          second = db.execute(lock_sql, (
              "system:scheduler-lock", json.dumps({"runId": "second", "until": now + 240_000}),
              now + 300_000, now + 1, now + 1
          ))
          assert second.rowcount == 0, "concurrent scheduler lock must be rejected"
          third = db.execute(lock_sql, (
              "system:scheduler-lock", json.dumps({"runId": "third", "until": now + 500_000}),
              now + 560_000, now + 300_001, now + 300_001
          ))
          assert third.rowcount == 1, "expired scheduler lock should be replaceable"
          print("D1 migrations and scheduler lock checks passed.")
          PY
      - name: Verify production-safety invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path("functions/api/scheduled-runner.js").read_text(encoding="utf-8")
          media = Path("functions/api/instagram-media.js").read_text(encoding="utf-8")
          assert 'new URL(request.url).origin' in runner, "Instagram media must use the current deployment origin"
          assert 'https://cloudflare-migration.postflow3.pages.dev' not in runner, "Legacy preview host must not be hardcoded"
          assert 'POSTFLOW3_SCHEDULER_SECRET' in runner, "Scheduler authorization guard is missing"
          assert 'POSTFLOW3_SESSION_SECRET' in runner, "Instagram media signature secret guard is missing"
          assert 'media_download_failed' in media or 'drive_download_failed' in media, "Instagram media diagnostics are missing"
          print("Production-safety invariants passed.")
          PY
